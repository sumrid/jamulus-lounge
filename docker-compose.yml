services:
  gojam:
    image: ghcr.io/dtinth/gojam:main
    init: true
    command: gojamclient -name ${JAMULUS_CLIENT_NAME} -server ${JAMULUS_SERVER:-127.0.0.1:22124} -apiserver 127.0.0.1:${GOJAM_API_PORT:-9999} -mp3 -vad
    network_mode: host
    restart: always

  # web server
  server:
    image: node:20-alpine
    working_dir: /app/server
    init: true
    network_mode: host
    command: npx tsx web/index.mjs
    restart: always
    depends_on:
      - gojam
    volumes:
      - ./server:/app/server
      - ./public:/app/public
      - ./node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false

  # audio recording server
  clipper:
    image: node:20-alpine
    working_dir: /app/server
    init: true
    network_mode: host
    command: npx tsx clipper/index.mjs
    restart: always
    depends_on:
      - server
      - upload-endpoint
    volumes:
      - ./server:/app/server
      - ./public:/app/public
      - ./node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false

  # audio upload endpoint
  upload-endpoint:
    image: oven/bun
    working_dir: /app/server
    init: true
    network_mode: host
    command: bun upload/index.mts
    restart: always
    volumes:
      - ./server:/app/server
      - ./node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false

  # ai chat message handler
  ai-chat:
    image: oven/bun
    working_dir: /app/server
    init: true
    network_mode: host
    command: bun ai-chat/index.mts
    restart: always
    volumes:
      - ./server:/app/server
      - ./node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
